[package]
name = "mainline-next"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Development crate for the Mainline DHT refactor"

[dependencies]
mio = { version = "1", features = ["net", "os-poll"], default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
serde_bencode = { version = "0.2", default-features = false }
tracing = "0.1"

[dev-dependencies]
hex-literal = "0.4"
